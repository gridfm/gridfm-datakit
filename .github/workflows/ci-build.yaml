name: CI Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always

  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v7

      - name: Install bandit
        run: pip install bandit

      - name: Security Checks
        run: bandit -r gridfm_datakit --severity-level high

  pytests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      # Cache the whole Julia depot (downloaded packages, artifacts and, most
      # importantly, the precompile cache). Keyed on the pinned solver versions
      # so it only rebuilds when juliapkg.json changes.
      - name: Cache Julia depot
        uses: actions/cache@v6
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-julia1.12-${{ hashFiles('gridfm_datakit/juliapkg.json') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-julia1.12-

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]"

      # Resolve, install and precompile the pinned Julia packages from
      # juliapkg.json. Forcing `using` (not just `import juliacall`) precompiles
      # PowerModels/Ipopt/Memento into the depot so the cache captures it and the
      # first test doesn't pay for it; it also fails fast here if the pinned
      # versions don't resolve together. Near-instant on a cache hit.
      - name: Set up Julia packages (PowerModels)
        run: |
          python -c "from juliacall import Main as jl; jl.seval('using PowerModels, Ipopt, Memento')"

      - name: Unit tests
        run: |
          export SKIP_LARGE_GRIDS=1
          pytest --cov=. tests/ -v -s

  dynamic-pytests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DYNAWO_VERSION: '1.7.0'
    steps:
      - uses: actions/checkout@v7

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: actions/cache@v6
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-julia1.12-${{ hashFiles('gridfm_datakit/juliapkg.json') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-julia1.12-

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ unzip curl

      - name: Cache Dynawo
        id: cache-dynawo
        uses: actions/cache@v6
        with:
          path: ~/dynawo
          key: dynawo-${{ runner.os }}-${{ env.DYNAWO_VERSION }}

      - name: Install Dynawo
        if: steps.cache-dynawo.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/dynawo.zip \
            "https://github.com/dynawo/dynawo/releases/download/v${DYNAWO_VERSION}/Dynawo_Linux_v${DYNAWO_VERSION}.zip"
          unzip -q /tmp/dynawo.zip -d "$HOME"
          rm /tmp/dynawo.zip

      - name: Configure powsybl
        run: |
          mkdir -p ~/.itools
          printf 'dynawo:\n  homeDir: %s\n  debug: false\n' "$HOME/dynawo" > ~/.itools/config.yml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test,dynamic,powsybl,lightsim2grid]"

      - name: Set up Julia packages (PowerModels)
        run: python -c "from juliacall import Main as jl; jl.seval('using PowerModels, Ipopt, Memento')"

      - name: Check Dynawo backend
        run: |
          "$HOME/dynawo/dynawo.sh" version
          python -c "from gridfm_datakit.dynamic.dynawo.api import check_dynawo_available; check_dynawo_available()"

      - name: Dynawo, powsybl and lightsim2grid tests
        run: pytest tests/dynamic tests/powsybl tests/lightsim2grid -v

  windows-pytests:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: actions/cache@v6
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-julia1.12-${{ hashFiles('gridfm_datakit/juliapkg.json') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-julia1.12-

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]"

      - name: Set up Julia packages (PowerModels)
        run: python -c "from juliacall import Main as jl; jl.seval('using PowerModels, Ipopt, Memento')"

      - name: Unit tests
        run: |
          export SKIP_LARGE_GRIDS=1
          pytest tests/ -v --durations=25

  integration-tests:
    # End-to-end dataset-generation tests. The calibrated baseline is machine
    # sensitive (solver numerics), so instead of asserting against the committed
    # baseline we rebuild it from the base branch on THIS runner, then assert the
    # PR head against it. Same machine for both phases -> the --pad floor only has
    # to absorb run-to-run jitter, not cross-environment drift.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Baseline is written in phase 1 and read in phase 2. Keep it in RUNNER_TEMP
      # (outside the workspace) so the phase-2 checkout does not wipe it. Set via
      # $GITHUB_ENV because the runner.* context is not available in job-level env.
      - name: Set baseline path
        run: echo "GRIDFM_CALIBRATION_BASELINE=$RUNNER_TEMP/baseline.json" >> "$GITHUB_ENV"

      # Cache the base-branch baseline so we only recalibrate when the base commit
      # or the solver/deps change. The key pins:
      #   - base SHA: a new base means possibly-different generated data
      #   - runner image: baselines are machine sensitive; a new image must recalibrate
      #   - juliapkg.json + pyproject.toml of the BASE: a solver/dep bump shifts numerics
      # On a hit, phase 1 (checkout base -> calibrate) is skipped entirely. On a miss
      # we calibrate inline and the cache is saved at job end (post step).
      - name: Checkout base for cache key inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-src

      - name: Restore base baseline
        id: baseline-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/baseline.json
          key: >-
            e2e-baseline-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-${{ hashFiles('base-src/gridfm_datakit/juliapkg.json', 'base-src/pyproject.toml') }}

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: actions/cache@v6
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-julia1.12-${{ hashFiles('base-src/gridfm_datakit/juliapkg.json') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-julia1.12-

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('base-src/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # --- Phase 1: calibrate on the base branch (skipped on a baseline cache hit) ---
      - name: Install base package and calibrate baseline
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        working-directory: base-src
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]"
          python -c "from juliacall import Main as jl; jl.seval('using PowerModels, Ipopt, Memento')"
          pytest integrationtests -s --calibrate

      # --- Phase 2: assert the PR head against the (cached or fresh) baseline ---
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head-src

      - name: Install package at PR head
        working-directory: head-src
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]"
          python -c "from juliacall import Main as jl; jl.seval('using PowerModels, Ipopt, Memento')"

      - name: Assert PR head against base-calibrated baseline
        working-directory: head-src
        run: pytest integrationtests -s

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
