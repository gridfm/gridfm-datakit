# End-to-end dynamic-simulation example (IEEE14 + Dynawo).
# Paths are RELATIVE to this folder and resolved to absolute by run.py, so the
# example runs from any working directory. Run it with:  python run.py
# (or: python scripts/dynamic_example/run.py from the project root).

network:
  name: IEEE14
  reader: powsybl          # dynamic simulations require the powsybl reader
  source: file
  file: grids/IEEE14.iidm  # xiidm network (element IDs match the input CSVs below)

load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 6             # a few scenarios so chunk progress is visible
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.05
  start_scaling_factor: 0.8

# Topology / generation / admittance perturbations are optional. Left at "none"
# here; enable e.g. topology_perturbation to expand each scenario into several
# samples (one Dynawo run per perturbed topology).
#
# Only topology_perturbation is a supported source of dynamic diversity.
# generation_perturbation (generation *cost* randomisation) and
# admittance_perturbation are accepted for parity with the static pipeline, but
# in the dynamic pipeline they only shift the OPF dispatch — i.e. the initial
# operating point — and add no dynamic-model or event variation. They are not
# validated against the dynamic outputs.
topology_perturbation:
  type: none               # options: random, n_minus_k, none
  # When type is "random", also set (uncomment) these:
  # k: 1
  # n_topology_variants: 2
  # elements: [branch, gen]

dynamic:
  dynamic_solver: dynawo
  input_files:
    static_element_dynamic_models_file: inputs/static_element_dynamic_models.csv
    automation_systems_file: inputs/automation_systems.csv
    events_file: inputs/events.csv
    variables_file: inputs/variables.csv
  solver_parameters:
    start_time: 0.0
    stop_time: 500.0
    parameters_file: grids/IEEE14.par
    network_parameters_file: grids/IEEE14.par
    network_parameters_id: Network
    solver_type: SIM
    solver_parameters_file: grids/IEEE14.par
    solver_parameters_id: SimplifiedSolver
  # Optional. Governs the AC power flow that produces the balanced initial state.
  # The defaults below are applied when this block is absent; they differ from the
  # static pipeline's on purpose. Dynawo initialises each synchronous machine from
  # this solution, so the slack has to sit on a machine that carries a dynamic
  # model — OpenLoadFlow's own default (MOST_MESHED) can pick a bus with no
  # generator at all.
  # loadflow_parameters:
  #   distributed_slack: false
  #   read_slack_bus: true
  #   write_slack_bus: true
  #   provider_parameters:
  #     slackBusSelectionMode: LARGEST_GENERATOR
  logging:
    verbosity: info        # progress logger threshold: silent|error|warning|info|debug
    save_reports: true     # persist each simulation's Dynawo report under raw/dynamic/reports/

settings:
  num_processes: 2
  # Single output root for the whole run. Everything lands under
  # out/IEEE14/raw/ : logs + scenarios directly there, dynamic artifacts in
  # out/IEEE14/raw/dynamic/. There is no separate dynamic output directory.
  data_dir: out
  large_chunk_size: 3      # 6 scenarios / 3 -> 2 chunks -> visible chunk progress
  overwrite: true
  mode: pf
  include_dc_res: false
  # Keep solver logs OFF so the console shows only pipeline progress. Turning
  # this on raises solver verbosity to DEBUG, which un-silences PowerModels; its
  # Julia-level logger is not reliably captured by the file router and can spill
  # [ PowerModels | Info/Warn ] lines onto the console. See README.
  enable_solver_logs: false
  pf_fast: false
  dcpf_fast: false
  max_iter: 200
  pf_solver: powsybl
  seed: 42
