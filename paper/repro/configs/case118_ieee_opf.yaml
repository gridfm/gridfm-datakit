# Configuration used to generate the gridfm-datakit OPF dataset compared in
# gridfm-datakit-v1 (arXiv:2512.14658).
#
# Recorded from the args.log of the original run (2025-11-12). Produces ~200,000
# samples: 10,000 load scenarios x 20 topology variants. Of these, 195,753
# converged and 10,000 were sampled for the published figures.
#
#   gridfm_datakit generate paper/repro/configs/case118_ieee_opf.yaml
#
# OPF mode: load, cost and admittance perturbations are applied, then topology
# perturbations, and an ACOPF is solved for every topology variant. Every sample is
# therefore cost-optimal and satisfies all operating limits. This costs far more
# than PF mode, which solves only one OPF per load scenario.
#
# Identical to case118_ieee_pf.yaml except for settings.mode and settings.data_dir.

network:
  name: "case118_ieee" # Name of the power grid network (without extension)
  source: "pglib" # Data source for the grid; options: pglib, file
  network_dir: "scripts/grids" # unused with source "pglib"

load:
  generator: "agg_load_profile" # hybrid global scaling + local noise
  agg_profile: "default" # Name of the aggregated load profile
  scenarios: 10000 # Number of different load scenarios to generate
  sigma: 0.2 # max local noise (paper: sigma = 0.2, as in PGLearn and OPFData)
  change_reactive_power: true # If true, also scales reactive load
  global_range: 0.4 # Range of the global scaling factor (paper: r = 0.4, as in PGLearn)
  max_scaling_factor: 4.0 # Max upper bound of the global scaling factor
  step_size: 0.1 # 10% steps when searching for the feasible upper bound u
  start_scaling_factor: 1.0 # Initial value of the global scaling factor

topology_perturbation:
  type: "random" # Type of topology generator; options: n_minus_k, random, none
  k: 1 # N-1: at most one component dropped per variant (for parity with other libraries)
  n_topology_variants: 20 # Number of unique perturbed topologies per scenario
  elements: [branch, gen] # Perturb lines/transformers and generators

generation_perturbation:
  type: "cost_permutation" # Permute generator cost coefficients, as in PFDelta
  sigma: 1.0 # Unused by cost_permutation (only read by cost_perturbation)

admittance_perturbation:
  type: "random_perturbation" # Scale branch r and x by a uniform factor
  sigma: 0.2 # Range (max(0, 1-sigma), 1+sigma); a feature absent in other libraries

settings:
  num_processes: 16 # Number of parallel processes to use
  data_dir: "./opf_baseline_perturbations_nov_12" # Output directory
  large_chunk_size: 10000 # Load scenarios processed before each flush to parquet
  overwrite: true # If true, overwrites existing files
  mode: "opf" # OPF mode; see header
  include_dc_res: true # Also store DC-OPF results as an ML baseline
  enable_solver_logs: true # Write solver logs to {data_dir}/solver_log
  pf_fast: true # Use compute_ac_pf from PowerModels.jl
  dcpf_fast: true # Use compute_dc_pf from PowerModels.jl
  max_iter: 200 # Max iterations for Ipopt-based solvers
  seed: null # Not set for the original run, so it is not bit-reproducible
